<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./media/icon/icon.png">
    <title>Unit Converter (Meteric/Imperial)</title>

    <link rel="stylesheet" href="./assets/css/styles.css">
</head>

<body>
    <div class="main">
        <div class="conversions-head">
            <h3 class="head-h3">Metric/Imperial Unit Conversion</h3>
            <div class="input-num">
                <input id="figure" class="head-input" placeholder="click" type="number" min="0">
                <button class="num-down">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-arrow-down" viewBox="0 0 16 16">
                        <path fill-rule="evenodd"
                            d="M8 1a.5.5 0 0 1 .5.5v11.793l3.146-3.147a.5.5 0 0 1 .708.708l-4 4a.5.5 0 0 1-.708 0l-4-4a.5.5 0 0 1 .708-.708L7.5 13.293V1.5A.5.5 0 0 1 8 1" />
                    </svg>
                </button>
                <button class="num-up">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-arrow-up" viewBox="0 0 16 16">
                        <path fill-rule="evenodd"
                            d="M8 15a.5.5 0 0 0 .5-.5V2.707l3.146 3.147a.5.5 0 0 0 .708-.708l-4-4a.5.5 0 0 0-.708 0l-4 4a.5.5 0 1 0 .708.708L7.5 2.707V14.5a.5.5 0 0 0 .5.5" />
                    </svg>
                </button>
            </div>
            <button id="convert" class="btn">Convert</button>
        </div>
        <div class="conversions">
            <div class="conversion">
                <h4 class="h4">Length (Meter/Feet)</h4>
                <p id="length-data" class="data">? meters = ? feet | ? feet = ? meters</p>
            </div>
            <div class="conversion">
                <h4 class="h4">Volume (Liters/Gallons)</h4>
                <p id="volume-data" class="data">? liters = ? gallons | ? gallons = ? liters</p>
            </div>
            <div class="conversion">
                <h4 class="h4">Mass (Kilograms/Pounds)</h4>
                <p id="mass-data" class="data">? kilos = ? pounds | ? pounds = ? kilos</p>
            </div>
        </div>
    </div>

    <script src="./assets/js/scripts.js"></script>
</body>

</html>
